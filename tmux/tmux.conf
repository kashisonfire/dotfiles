# ~/.tmux.conf — Rosé Pine Moon, styled to match Kun Chen's agentic workflow setup.
#
# Palette (https://rosepinetheme.com/palette/ingredients/, moon variant), for
# reference when editing below. These are deliberately NOT tmux user options:
# style options such as status-style are not format-expanded, so tmux would store
# a "#{@base}" reference verbatim and render it as a garbage colour — and it does
# so silently, because "#{...}" is shaped enough like a hex literal to survive
# tmux's style validation. Hex goes inline.
#
#   base #232136   surface #2a273f   overlay #393552   hl-med #44415a
#   muted #6e6a86  subtle  #908caa   text    #e0def4
#   love #eb6f92   gold #f6c177      rose #ea9a97
#   pine #3e8fb0   foam #9ccfd8      iris #c4a7e7

# ---------------------------------------------------------------- prefix

unbind C-b
set -g prefix C-a
# Without this, C-a is swallowed and zsh loses beginning-of-line. A double-tap
# passes it through to the shell.
bind C-a send-prefix

# ---------------------------------------------------------------- bindings

# The default " and % give no hint which axis they split.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New splits/windows open where you already are, not in $HOME.
bind c new-window -c "#{pane_current_path}"

bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# Prefix-free pane navigation.
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Window switching without the prefix, for flipping between parallel agents.
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6

# prefix+g — "go": pick a directory out of zoxide's database in a popup, and open
# a new window there. The shell's own `z` already covers cd-ing the pane you are
# sitting in; what tmux adds is *starting* somewhere without walking there first.
# Splits and new windows already inherit #{pane_current_path} above, so this is
# only for the case where the new pane wants a different directory entirely.
#
# g rather than f: prefix+f is find-window, which is still worth having.
#
# Deliberately a new window rather than send-keys "cd ..." into the current pane.
# Panes here mostly hold agents, and send-keys would type the cd into Claude
# Code's prompt and submit it as a message.
#
# ~/.fzf/bin is prepended because `zoxide query -i` shells out to fzf, and a
# popup inherits the tmux *server's* environment -- which has fzf on PATH when
# the server was started from zsh, and does not when it was started from bash or
# by systemd. xargs -r is what makes escaping out of the picker do nothing.
bind g display-popup -E -w 60% -h 60% -d "#{pane_current_path}" \
  'PATH="$HOME/.fzf/bin:$PATH" zoxide query -i | xargs -r -I{} tmux new-window -c {}'

# ---------------------------------------------------------------- behavior

set -g mouse on
set -g allow-rename off
set -g history-limit 50000

# Panes get zsh, so the ghost-text autocomplete in ~/.zshrc is present inside
# tmux and not only in a bare WezTerm tab. Stated explicitly rather than left to
# $SHELL: tmux falls back to $SHELL first, and anything that started life under
# bash passes down SHELL=/bin/bash regardless of the passwd entry. With
# default-command empty, tmux starts this as a login shell.
set -g default-shell /usr/bin/zsh

# Windows start at 1 so they line up with the number keys, and closing one in the
# middle doesn't leave a hole in the sequence.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# The 500ms default makes ESC in vim feel like the terminal has hung.
set -g escape-time 10

# Lets vim's autoread fire when a file changes outside the editor.
set -g focus-events on

set -g default-terminal "tmux-256color"
# terminal-features is the tmux 3.2+ replacement for the old Tc override. RGB is
# what makes the hex palette render as itself rather than snapping to the nearest
# xterm-256 slot.
set -as terminal-features ",*:RGB"

# Pass modified keys through as CSI u rather than collapsing them to their
# unmodified byte. tmux only negotiates this with terminals that advertise
# extkeys -- the outer TERM here is xterm-256color, so the pattern has to match
# that and not the tmux-256color seen from inside a pane.
# https://code.claude.com/docs/en/terminal-config#configure-tmux
#
# This does NOT cover Shift+Enter, despite what that page implies: tmux 3.4
# requests modifyOtherKeys level 1 from the outer terminal (Eneks=\E[>4;1m in
# `tmux info`), and level 1 exempts Return by definition, so Shift+Enter never
# reaches tmux as anything but a bare CR. That one is bound WezTerm-side to send
# ESC+CR instead -- see config.keys in wezterm/wezterm.lua.
set -s extended-keys on
set -as terminal-features "xterm*:extkeys"

# Re-emit OSC 8 hyperlinks to the outer terminal. tmux parses and stores them
# either way, but it only writes them back out when the client's terminal has the
# Hls capability, and it decides that from the TERM name alone -- the default
# feature set for xterm-256color does not include hyperlinks, so `tmux info` had
# "Hls: [missing]" and every link was flattened to its label text on the way out.
# Anything emitting a hyperlink whose text is not itself a URL ("Local Dev
# Server" rather than http://...) reached WezTerm with nothing left to click.
#
# Terminal features are resolved when a client attaches, so this one needs a
# detach/reattach rather than just prefix+r.
set -as terminal-features "xterm*:hyperlinks"

# ---------------------------------------------------------------- clipboard

set -g mode-keys vi

# OSC 52 — tmux hands the yank to the terminal emulator, which owns the system
# clipboard. Under native Windows WezTerm that lands directly in the Windows
# clipboard, so no clip.exe shell-out is needed.
set -g set-clipboard on
set -g allow-passthrough on

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# ---------------------------------------------------------------- quiet

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off

# Activity is worthless as a signal in a session full of agents: anything
# streaming tokens marks its window every second, so every window is always
# flagged. The bell is the signal that carries information -- Claude Code rings
# it when a task finishes or a permission prompt is waiting, i.e. exactly when
# that agent wants you. Needs preferredNotifChannel=terminal_bell in
# ~/.claude/settings.json, or Claude Code sends a desktop notification instead
# and never rings.
setw -g monitor-activity off
setw -g monitor-bell on
# `none` suppressed the per-window bell flag along with the audible bell, so
# nothing ever reached window-status-bell-style below. That is what left the
# status bar with no way to show which agent was waiting.
set -g bell-action any

# ---------------------------------------------------------------- design

set -g pane-border-style "fg=#393552"
set -g pane-active-border-style "fg=#3e8fb0"

set -g message-style "fg=#232136 bg=#f6c177 bold"
set -g mode-style "fg=#232136 bg=#c4a7e7"
setw -g clock-mode-colour "#9ccfd8"

# Top, as in the video — the bar is the at-a-glance readout for parallel agent
# sessions, and at the top it isn't competing with the shell prompt for attention
# at the bottom of the screen.
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-style "fg=#908caa bg=#232136"

set -g status-left "#[fg=#232136,bg=#c4a7e7,bold] #S #[default] "
set -g status-left-length 30

set -g status-right "#[fg=#6e6a86]#h #[fg=#393552]│ #[fg=#908caa]%Y-%m-%d #[fg=#393552]│ #[fg=#e0def4]%H:%M "
set -g status-right-length 60

# tmux layers these: window-status-style is the base, and tmux substitutes the
# bell style for a window that wants attention or the current style for the one
# you are on. An inline #[...] directive in a format overwrites whichever style
# tmux just chose -- which is why the bell colour once never appeared no matter
# what rang it. So the only thing that overrides them is the state mark below: it
# paints itself and hands the style back with #[default].
#
# The bell keeps no block of its own. A red fill and a foam ✓ are the same
# sentence said twice, and the two colours land on top of each other; the mark
# says it, and the style only lifts the label to full brightness.
setw -g window-status-style "fg=#908caa bg=#232136"
setw -g window-status-current-style "fg=#232136 bg=#9ccfd8 bold"
setw -g window-status-bell-style "fg=#e0def4 bg=#232136"

# What Claude Code publishes to the terminal by itself is one OSC 0 title,
# "<glyph> <topic>", and neither half can carry a window list on its own.
#
# The glyph is a live busy light for the main loop: ◐/◑ alternating on a 960ms
# timer is busy, ✳ is not. It is still what says busy below, because it has no
# gap. Claude Code re-emits it continuously rather than announcing edges, so it is
# right again the moment a turn is interrupted or dies, which is more than any
# hook manages.
#
# Two things it cannot say. A pending permission prompt is indistinguishable from
# idle, which is why the bell above is wired on. And work handed to a background
# subagent or to a workflow outlives the turn that launched it, so the window
# drops back to ✳ and reads as finished while several agents are still going.
#
# That second one is what the hooks fix. tmux/agent-status.py in this repo is run
# by four hooks in ~/.claude/settings.json and writes a single option onto the
# pane each session runs in:
#
#   @claude_tasks   N   background subagents and workflows still running
#
# It comes from the list Claude Code hands the Stop and SubagentStop hooks, so it
# is read rather than inferred: no tallying of start events against stop events,
# and nothing left behind by a session killed mid-turn. Busy is deliberately not
# tracked the same way; agent-status.py explains why at length.
#
# One mark, one meaning: something is running in this window. ↻ is the state and
# the number after it is how many background agents, because with work in flight
# the count is the more useful of the two -- busy or idle is not the question at
# that point, both mean the window is not finished with you. Only subagents and
# workflows are counted, never background shells, because a dev server never
# finishes and would pin those windows to a permanent mark.
# A pane is a Claude pane when its title carries one of the glyphs, not when
# #{pane_current_command} says "claude". While a turn runs a Bash tool the shell
# takes the tty foreground and the pane reads as zsh, which blanked the mark and
# dropped the label back to the directory for exactly the windows that were busy.
set -g @agent-pane-claude "#{!=:#{s/^[◐◑✳] //:pane_title},#{pane_title}}"

set -g @agent-pane-tasks "#{?#{&&:#{E:@agent-pane-claude},#{>:#{@claude_tasks},0}},↻#{@claude_tasks},}"

# Every pane in the window, not only the active one. A window list can show just
# one pane's title, so background work started by the second agent of a split
# would otherwise be invisible; looping the panes puts each one's count on the bar
# instead, as ↻2↻1 and so on.
set -g @agent-tasks "#{P:#{E:@agent-pane-tasks}}"

# Busy is the same ↻ without a count, still read straight out of the title glyph.
# The pane loop here answers "is any pane busy" rather than printing one mark per
# pane: a split of three agents all mid-turn says ↻ once, because the number on
# this mark is reserved for background work.
set -g @agent-pane-busy "#{?#{!=:#{s/^[◐◑] //:pane_title},#{pane_title}},1,}"
set -g @agent-busy "#{P:#{E:@agent-pane-busy}}"

# Kept free of colour so the same mark can go out to the WezTerm title below
# without leaking SGR escapes into it.
set -g @agent-mark-raw "#{?#{E:@agent-tasks},#{E:@agent-tasks},#{?#{E:@agent-busy},↻,}}"

# Gold ↻ running, foam ✓ done, and nothing at all for idle -- a bar that marks
# every window says nothing. Done is the bell rather than a fifth hook: Claude
# Code rings the terminal bell when a turn ends or a permission prompt is waiting,
# and tmux clears the flag when you look at the window, so ✓ means "finished, not
# seen yet" and retires itself once it has done its job. Running wins when both
# are true, being the newer fact. A permission prompt is indistinguishable from a
# finished turn, which is the same blind spot the bell has always had; both mean
# the agent wants you, so both get ✓.
#
# The mark owns its trailing space, so an unmarked window closes the gap instead
# of holding an empty column open.
#
# Only for windows you are not on. The current window is a foam block, and gold on
# foam is a contrast ratio of 1.04 -- not dim, invisible -- so its mark keeps the
# block's own dark foreground instead, which a thin ↻ wears fine where the old
# filled ● could not. Nothing is lost: running is still legible as a shape, done
# cannot occur there because selecting a window is what clears its bell, and the
# state of the window you are looking at is the one you least need a colour for.
set -g @agent-mark "#{?#{E:@agent-mark-raw},#[fg=#f6c177]#{E:@agent-mark-raw}#[default] ,#{?window_bell_flag,#[fg=#9ccfd8]✓#[default] ,}}"

# The topic is read through #{pane_title}, always minus its leading glyph, because
# it is the only name a conversation has. The glyph goes because the mark above
# already says the same thing about every window in one fixed column, and three
# more circles (◐ ◑ ✳) saying it again in a second place is what made the bar
# read as noise. It is generated once
# when the conversation first finds its subject, so it names that subject and not
# what the agent is doing this second. Keep it legible with a short /rename: the
# generated topics run 40-50 characters and their distinguishing half is usually
# last, so they are what loses to the truncation below.
#
# The stripped set is 2.1.228's. The frames changed there (they were ⠂/⠐ before),
# so an older Claude Code leaves its glyph sitting in the label and never reads as
# busy, rather than breaking anything.
#
# #{pane_title} rather than allow-rename, because a rename mutates the window
# name: several agents split into one window would fight over it, and whatever the
# last one said would stay on the tab after it exits.
#
# The other branch is for windows with no agent in them. automatic-rename is on,
# so #W there is the running command ("zsh"), which identifies nothing, while the
# directory does. An explicit prefix+, rename turns automatic-rename off and is
# honoured over it.
set -g @agent-label "#{?#{E:@agent-pane-claude},#{s/^[◐◑✳] //:pane_title},#{?automatic-rename,#{b:pane_current_path},#W}}"

# The truncation budget is shared out across the windows that exist rather than
# fixed at one number: four agents leave room for a whole title, six do not, and
# the WezTerm window is a different width docked than on the laptop panel. 25 is
# the fixed chrome in status-left and status-right -- their padding, the two
# dividers, the date, the clock -- while the hostname and session name are
# measured because both vary. 10 is the per-window chrome: #I, its two spaces, the
# trailing space, the zoom flag, and one mark with its own space (three cells,
# enough for ↻12). A window running several agents at once spends a little of its
# label on the extra marks, which is the right way round: the marks are the part
# being read. Floored at 14 so a narrow terminal clips the
# window list rather than computing a negative width, which =/N/ reads as
# trim-from-the-end and renders backwards without complaining.
set -g @agent-label-fit "#{e|-:#{e|/:#{e|-:#{client_width},#{e|+:#{e|+:#{n:host_short},#{n:session_name}},25}},#{session_windows}},10}"
set -g @agent-label-width "#{?#{<:#{E:@agent-label-fit},14},14,#{E:@agent-label-fit}}"
#
# #F is spelled out rather than used directly: it would append "*" to the current
# window, which the foam block already says louder, and "-" to the previous one,
# which is not information anyone acts on. Zoom is the one flag left -- it
# explains why the other panes vanished. The bell has no flag character any more,
# it is the ✓, in the column the eye is already reading.
setw -g window-status-format " #I #{E:@agent-mark}#{=/#{E:@agent-label-width}/…:#{E:@agent-label}}#{?window_zoomed_flag,Z,} "
setw -g window-status-current-format " #I #{?#{E:@agent-mark-raw},#{E:@agent-mark-raw} ,}#{=/#{E:@agent-label-width}/…:#{E:@agent-label}}#{?window_zoomed_flag,Z,} "
setw -g window-status-separator ""

# The same label out to the WezTerm window title, so the active agent's status is
# legible from the Windows taskbar while the terminal is in the background.
set -g set-titles on
set -g set-titles-string "#{?#{E:@agent-mark-raw},#{E:@agent-mark-raw} ,}#{?#{E:@agent-pane-claude},#{E:@agent-label},#S: #W}"

# ---------------------------------------------------------------- plugins

# TPM has to be told what to manage, and it has to be run. A clone in
# ~/.tmux/plugins is not enough on its own: without this list and the run line at
# the bottom of the file, tmux-which-key sat there fully installed and never
# loaded a single binding.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'alexwforsythe/tmux-which-key'

# A tmux server cannot outlive the machine, and nothing can freeze a live
# process. What resurrect saves is the *shape* of a session -- windows, panes,
# layout, and each pane's working directory -- so a WSL restart costs the
# processes but not the arrangement.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Scrollback as well. Worth the larger save file here: history-limit is 50000 and
# an agent's transcript is most of the context you were holding when the machine
# went down.
set -g @resurrect-capture-pane-contents 'on'

# `claude` is deliberately absent from @resurrect-processes. Relaunching it would
# produce fresh agents carrying none of the conversation, which looks restored
# and isn't. Panes come back as shells in the right directory instead, and
# `claude --continue` picks up that directory's last conversation.

set -g @continuum-save-interval '15'

# Auto-restore stays off. This is also continuum's default, and is set explicitly
# so it reads as a decision rather than an oversight: restore fires whenever the
# *server* starts, which fights with session.sh -- has-session finds no server,
# session.sh starts one with a freshly built session, and the restore then layers
# the saved windows on top of it. It also means starting tmux for a ten-second
# one-off drags every saved session back. prefix + C-r restores on demand,
# prefix + C-s saves without waiting for the interval.
set -g @continuum-restore 'off'

# Last line, because TPM reads the @plugin list at the moment it runs: any
# `set -g @plugin` below this point would never be seen.
run '~/.tmux/plugins/tpm/tpm'
